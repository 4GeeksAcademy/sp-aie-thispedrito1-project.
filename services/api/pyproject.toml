[project]
name = "healthcore-suppliers-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "python-multipart==0.0.17",
  "tinydb==4.8.2",
  "email-validator==2.2.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "python-dotenv==1.0.1",
  "resend==2.34.0",
  "sqlmodel==0.0.24",
  "psycopg2-binary==2.9.12",
  "pandas==2.2.3",
  "prefect>=3.4,<4",
  "celery[redis]==5.6.3",
  "redis==6.4.0",
  "flower==2.0.1",
  "qdrant-client==1.16.1",
  "openai==2.48.0"
]

[project.scripts]
seed = "seed:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
omit = [".venv/*", "tests/*", "seed.py"]
