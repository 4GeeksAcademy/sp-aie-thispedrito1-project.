# HealthCore — endurecimiento de SSH (auditoría OWASP, feature/owasp-top10-audit).
#
# harden.sh lo instala como /etc/ssh/sshd_config.d/00-healthcore-hardening.conf.
# El "00" importa: sshd se queda con el PRIMER valor que lee de cada opción y
# Ubuntu incluye sshd_config.d/*.conf al principio de sshd_config, así que esto
# gana aunque el archivo principal diga "PermitRootLogin yes".

# Nadie entra como root, ni con contraseña ni con clave.
PermitRootLogin no

# Solo claves: sin contraseñas que adivinar por fuerza bruta.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes

# Solo el usuario operativo puede abrir sesión.
AllowUsers healthcore

# Menos margen para la fuerza bruta y las sesiones colgadas.
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# Sin túneles ni reenvíos que abran caminos a puertos internos (Postgres,
# Redis, Qdrant) saltándose el firewall.
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
